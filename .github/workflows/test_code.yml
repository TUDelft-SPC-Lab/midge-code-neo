name: Test Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  pytest_commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install the project and its dependencies
        run: uv sync

      - name: Run prek
        run: uv run prek run --all-files

      - name: Run Pytest
        run: uv run pytest --cov=packages --cov-report term ./tests
